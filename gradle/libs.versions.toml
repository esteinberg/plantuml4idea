[versions]
# libraries
plantuml = "1.2026.8"
commons-lang = "3.18.0"
junit = "4.13.2"
opentest4j = "1.3.0"
echosvg = "2.5"
# plugins
changelog = "2.5.0"
intelliJPlatform = "2026.3"
intelliJPlatformPlugin = "2.20.1"
kotlin = "2.4.21"
kover = "0.9.1"
qodana = "2024.3.4"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
plantuml = { group = "net.sourceforge.plantuml", name = "plantuml-mit", version.ref = "plantuml" }
commons-lang = { group = "org.apache.commons", name = "commons-lang3", version.ref = "commons-lang" }
echosvg-all = { group = "io.sf.carte", name = "echosvg-all", version.ref = "echosvg" }
echosvg-codec = { group = "io.sf.carte", name = "echosvg-codec", version.ref = "echosvg" }
xml-apis = { module = "xml-apis:xml-apis" }
commons-io = { module = "commons-io:commons-io" }
commons-logging = { module = "commons-logging:commons-logging" }


[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intellij-platform = { id = "org.jetbrains.intellij.platform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
